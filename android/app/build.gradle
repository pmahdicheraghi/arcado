apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def packageJsonFile = file('../../package.json')
def packageJson = packageJsonFile.exists() ? new JsonSlurper().parseText(packageJsonFile.text) : [:]
def npmVersion = (packageJson.version ?: '1.0.0').toString()

def parseVersionCode(String version) {
    try {
        def clean = version.tokenize('-')[0].tokenize('+')[0]
        def parts = clean.tokenize('.').collect { it.toInteger() }
        def major = parts.size() > 0 ? parts[0] : 0
        def minor = parts.size() > 1 ? parts[1] : 0
        def patch = parts.size() > 2 ? parts[2] : 0
        return major * 10000 + minor * 100 + patch
    } catch (Exception ignored) {
        return 1
    }
}

def computedVersionCode = parseVersionCode(npmVersion)
def computedVersionName = npmVersion

def appVersionCode = (findProperty('VERSION_CODE') ?: System.getenv('VERSION_CODE')) ? Integer.parseInt((findProperty('VERSION_CODE') ?: System.getenv('VERSION_CODE')).toString()) : computedVersionCode
def appVersionName = (findProperty('VERSION_NAME') ?: System.getenv('VERSION_NAME')) ?: computedVersionName

android {
    namespace = "ir.arcado.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.arcado.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePath = findProperty('RELEASE_STORE_FILE') ?: System.getenv('RELEASE_STORE_FILE') ?: '../../android-twa/android.keystore'
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                def storePass = findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD') ?: ''
                storePassword storePass
                keyAlias findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('RELEASE_KEY_ALIAS') ?: 'android'
                keyPassword findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD') ?: storePass
            }
        }
    }
    buildTypes {
        release {
            def storePasswordVal = findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD')
            if (storePasswordVal) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('printVersion') {
    doLast {
        println "VERSION_NAME=${android.defaultConfig.versionName}"
        println "VERSION_CODE=${android.defaultConfig.versionCode}"
    }
}
